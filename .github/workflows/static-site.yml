name: Site statique

on:
  schedule:
    - cron: "15 4 * * *"   # chaque nuit à 04:15 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["static_site/**", "hatvp.py", ".github/workflows/static-site.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: static_site/requirements.txt

      - run: pip install -r static_site/requirements.txt

      - name: Génération du site
        run: python static_site/build.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          APP_URL: ${{ vars.APP_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: static_site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
